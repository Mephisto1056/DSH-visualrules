name: Feature request
description: Propose a rule, a surface, or a workflow change
title: "[feature] "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is hard or invisible today? Describe the workspace and team situation.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: What should the plugin do? Include the expected rule level (off / info / warn / block) if it is validation-related.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Workspace profile
        - Rule packs / injection
        - Commit validation
        - Git hooks
        - AI commit index
        - Existing rule sources
        - UI / i18n
        - API / extensibility
        - Documentation
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: textarea
    id: scope
    attributes:
      label: Scope and risks
      description: Does this require a repository write, a new host API, or a compatibility break?
  - type: checkboxes
    id: confirm
    attributes:
      label: Confirmations
      options:
        - label: I searched existing issues and the roadmap.
          required: true
        - label: This request does not require storing secrets.
          required: true
