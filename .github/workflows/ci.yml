name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Node ${{ matrix.node }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [20, 22]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Configure Git identity for hook tests
        run: |
          git config --global user.name "dsh-visualrules-ci"
          git config --global user.email "ci@dsh.invalid"
      - name: Install
        run: npm ci
      - name: Syntax, manifest, export surface
        run: npm run check
      - name: Tests
        run: npm test
      - name: Package contents
        run: npm pack --dry-run

  package:
    name: Package manifest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate the bundle manifest and locales
        run: |
          node -e "const p=require('./package.json'); if(!p.dsh?.bundle?.patch) throw new Error('missing dsh.bundle.patch'); if(!p.exports?.['./client']) throw new Error('missing ./client export')"
          node -e "for (const f of ['locale/en.json','locale/zh.json']) JSON.parse(require('fs').readFileSync(f,'utf8'))"
      - name: Check the hook runner is shipped
        run: |
          npm pack --silent >/dev/null
          tar -tzf dsh-visualrules-*.tgz | grep -E "lib/hook/check\.mjs|scripts/hooks\.mjs|locale/zh\.json" >/dev/null
          echo "package contains hook runner and locales"
